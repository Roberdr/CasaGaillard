<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1120" viewBox="0 0 900 1120">
  <defs>
    <pattern id="roof" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#d9d1c2"/><path d="M0 13.5H14" stroke="#c5bba9" stroke-width="1"/></pattern>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#29313a" flood-opacity=".18"/></filter>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#26323a}.title{font-size:30px;font-weight:700;letter-spacing:1.5px}.sub{font-size:15px;fill:#68747b;letter-spacing:2px}.label{font-size:16px;font-weight:700;letter-spacing:1.5px}.small{font-size:13px;fill:#68747b}.num{font-size:14px;font-weight:700;fill:#fff}
    </style>
  </defs>
  <rect width="900" height="1120" fill="#f4f2ed"/>
  <text x="70" y="75" class="title">CASA GAILLARD</text>
  <text x="70" y="106" class="sub">PLANTA ESQUEMÁTICA · INTERPRETACIÓN DE VISTA AÉREA</text>
  <g transform="translate(125 160)" filter="url(#shadow)">
    <!-- approximate site boundary and surrounding open yard -->
    <rect x="35" y="20" width="580" height="820" rx="6" fill="#dce3df" stroke="#9ba9a3" stroke-width="2"/>
    <path d="M50 32H600V828H50Z" fill="#e7e8e0" opacity=".62"/>
    <!-- main building footprint -->
    <path d="M110 200 L555 200 L565 762 L117 762 Z" fill="#eee9dd" stroke="#35434a" stroke-width="8"/>
    <path d="M130 222 L535 222 L544 740 L138 740 Z" fill="url(#roof)" stroke="#fff" stroke-width="3"/>
    <!-- roof breaks visible in aerial -->
    <path d="M135 390 L539 390 M137 485 L541 485 M139 580 L542 580 M141 675 L543 675" stroke="#8b8175" stroke-width="7"/>
    <path d="M135 395 L539 395 M137 490 L541 490 M139 585 L542 585 M141 680 L543 680" stroke="#f8f5ed" stroke-width="2"/>
    <!-- small north block / roof -->
    <rect x="220" y="85" width="230" height="90" fill="url(#roof)" stroke="#35434a" stroke-width="7"/>
    <!-- connector / entry strip at south -->
    <rect x="275" y="765" width="185" height="42" fill="#b6c4be" stroke="#35434a" stroke-width="5"/>
    <path d="M117 762H275 M460 762H565" stroke="#35434a" stroke-width="7"/>
  </g>
  <!-- labels -->
  <g>
    <circle cx="410" cy="333" r="16" fill="#3b7168"/><text x="410" y="338" text-anchor="middle" class="num">1</text>
    <text x="440" y="338" class="label">VOLUMEN PRINCIPAL</text>
    <text x="440" y="361" class="small">Cubierta longitudinal con varios paños</text>
    <path d="M420 352L580 450" fill="none" stroke="#3b7168" stroke-width="2"/>
    <circle cx="329" cy="246" r="16" fill="#3b7168"/><text x="329" y="251" text-anchor="middle" class="num">2</text>
    <text x="180" y="231" text-anchor="end" class="label">CUERPO NORTE</text>
    <path d="M306 246L230 245" stroke="#3b7168" stroke-width="2"/>
    <circle cx="492" cy="926" r="16" fill="#3b7168"/><text x="492" y="931" text-anchor="middle" class="num">3</text>
    <text x="520" y="931" class="label">ACCESO / ANEXO</text>
    <path d="M477 926L458 925" stroke="#3b7168" stroke-width="2"/>
  </g>
  <g transform="translate(738 190)">
    <path d="M0 35V0 M-10 13L0 0L10 13" fill="none" stroke="#26323a" stroke-width="3"/>
    <text x="0" y="57" text-anchor="middle" class="small">N</text>
  </g>
  <rect x="70" y="1000" width="760" height="1" fill="#c7cbc6"/>
  <text x="70" y="1030" class="small">Esquema de masas y cubiertas. Orientación y contorno inferidos visualmente; no está a escala.</text>
  <text x="70" y="1054" class="small">Los muros interiores, usos y dimensiones requieren levantamiento o planos de referencia.</text>
</svg>
